services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: metricguard
      POSTGRES_PASSWORD: ${METRICGUARD_POSTGRES_PASSWORD:-local-dev-only}
      POSTGRES_DB: metricguard
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metricguard"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    environment:
      METRICGUARD_DATABASE_URL: postgresql+psycopg://metricguard:${METRICGUARD_POSTGRES_PASSWORD:-local-dev-only}@db:5432/metricguard
      METRICGUARD_DATA_DIR: /data
      METRICGUARD_MODE: demo
    volumes:
      - artifacts:/data
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
  artifacts:
